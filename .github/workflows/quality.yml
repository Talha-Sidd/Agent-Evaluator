name: Reliability checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reliability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked mypy src
      - run: uv run --locked pytest --junitxml=reports/tests.xml
      - name: Evaluate candidate
        id: evaluation
        run: >-
          uv run --locked arl eval --json
          --snapshot reports/candidate.json --agent-version "$GITHUB_SHA"
          > reports/evaluation.json
      - name: Compare against reviewed baseline
        if: ${{ !cancelled() && steps.evaluation.outcome != 'skipped' }}
        run: >-
          uv run --locked arl compare
          --baseline evals/baselines/repopilot.json --candidate reports/candidate.json
          --json > reports/comparison.json
      - name: Replay frozen case
        run: uv run --locked arl replay run --case evals/replays/search-001.json --json
      - run: uv build
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reliability-${{ matrix.os }}
          path: reports/
          retention-days: 14
          if-no-files-found: warn
