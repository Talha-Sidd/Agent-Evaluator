[project]
name = "agent-reliability-lab"
version = "0.1.0"
description = "A small foundation for evaluating reliable tool-using agents."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.0,<3.0",
]

[project.scripts]
arl = "agent_reliability_lab.cli:main"

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.0",
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
